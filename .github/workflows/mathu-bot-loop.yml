# ═══════════════════════════════════════════════════════════════════════
# MathU Bot — Perpetual Loop GitHub Actions Workflow (v4)
# ═══════════════════════════════════════════════════════════════════════
#
# v4 changes (2026-11-15):
#   - Integrates the in-process github-log-shipper.ts: passes GHLOGS_* env
#     vars + GITHUB_TOKEN to the bot so it pushes live logs to a bot-logs
#     branch every 5 min between workflow runs.
#   - Adds `contents: write` permission so the shipper's GITHUB_TOKEN
#     fallback can push to the bot-logs branch. (PAT_TOKEN is still passed
#     through if set — useful for HF Spaces/Render runners that lack an
#     auto-injected GITHUB_TOKEN.)
#   - Uploads the full /tmp/mathu-logs/ directory as a 90-day workflow
#     artifact at the end of every run (full untruncated log per run).
#
# v3 (unchanged):
#   - Uses GITHUB_TOKEN (auto-managed, no PAT needed) instead of PAT_TOKEN
#   - Uses Playwright's install-deps command (handles Ubuntu 24.04 package renames)
#   - Upgraded Node.js to 22 (silences deprecation warning)
#
# HOW THIS WORKS:
#   1. This workflow starts and runs the bot for ~5.5 hours
#   2. Before timeout, it triggers ANOTHER run of itself using gh CLI + GITHUB_TOKEN
#   3. The new run starts immediately, keeping the bot alive
#   4. Repeat forever
#   5. In parallel, the in-process github-log-shipper.ts pushes live logs
#      to the bot-logs branch every 5 min (see docs/GITHUB-LOGS.md)
#
# MEMORY: GitHub's ubuntu-latest runners have 16GB RAM — plenty for
# Chrome + CanvasKit + the bot (peak ~600MB, 15.4GB free).
#
# COST:
#   - Public repo: UNLIMITED free minutes ✅
#   - Private repo: 2,000 free minutes/month (~5.5 runs of 6 hours each)
#   - Recommendation: make the repo PUBLIC for unlimited free runs
#
# SETUP REQUIRED:
#   1. Add all bot env vars as repository secrets (see SETUP.md)
#   2. NO Personal Access Token needed for the loop — uses built-in GITHUB_TOKEN.
#      (PAT_TOKEN is optional: only needed if you also run the bot on
#      HF Spaces/Render and want live log shipping from those runners.)
#   3. Run `./scripts/setup-bot-logs-branch.sh` once to create the bot-logs
#      branch (only if you want live log shipping).
#   4. Click "Run workflow" in the Actions tab to start the loop
# ═══════════════════════════════════════════════════════════════════════

name: MathU Bot Loop

# Triggers:
# - workflow_dispatch: manual start (you click "Run workflow" in GitHub)
# - repository_dispatch: triggered by the previous run before it times out
#   (kept for backwards compatibility, but we now use gh CLI for triggering)
on:
  workflow_dispatch:
  repository_dispatch:
    types: [loop_trigger]

# Grant the GITHUB_TOKEN permission to:
#   - trigger workflows (actions: write) — for the self-perpetuating loop
#   - push to the bot-logs branch (contents: write) — for github-log-shipper
permissions:
  actions: write
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350  # 5h 50m — leaves 10 min for cleanup + trigger

    steps:
      # ─── Step 1: Check out the bot code ───
      - name: Checkout code
        uses: actions/checkout@v4

      # ─── Step 2: Set up Node.js 22 ───
      # v3: Upgraded from 20 to 22 to silence deprecation warning
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # ─── Step 3: Install Chrome + WebGL dependencies ───
      # v3: Uses Playwright's install-deps command which knows the correct
      # package names for any Ubuntu version (handles 22.04 vs 24.04 differences
      # like libasound2 vs libasound2t64 automatically).
      # Then adds WebGL/Vulkan/Xvfb packages separately (Playwright doesn't include these).
      - name: Install Chrome + WebGL dependencies
        run: |
          # Playwright knows the exact packages Chrome needs for any Ubuntu version
          sudo npx playwright install-deps chromium
          # Also install WebGL/Vulkan/Xvfb libs (Playwright doesn't include these)
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libvulkan1 mesa-vulkan-drivers \
            libgl1-mesa-dri libegl1 libegl-mesa0 libgl1 libgles2 \
            xvfb xauth || true
          sudo rm -rf /var/lib/apt/lists/*

      # ─── Step 4: Install Playwright Chromium ───
      - name: Install Playwright Chromium
        run: npx playwright install chromium

      # ─── Step 5: Install bot dependencies ───
      - name: Install bot npm dependencies
        run: |
          npm install --ignore-scripts
          npm install --ignore-scripts @esbuild/linux-x64
          npm rebuild better-sqlite3

      # ─── Step 5.5: Setup Ollama + pull vision model ───
      # Installs Ollama on the runner, starts the server, and pulls a
      # vision-capable model. The bot's tribunal sends screenshots, so the
      # model MUST be vision-capable (qwen2.5vl:7b by default — matches the
      # default in providers-ollama.ts, .env.example, and bootstrap-calibration.ts).
      #
      # Non-fatal: continue-on-error true + `|| exit 0` guards mean if Ollama
      # fails to install or the model pull times out, the bot still runs and
      # falls back to cloud providers (AUDITOR_PROVIDER stays set but the
      # reachability probe in providers-ollama.ts will skip Ollama cleanly).
      - name: Setup Ollama + vision model
        continue-on-error: true
        run: |
          echo "Installing Ollama..."
          curl -fsSL https://ollama.com/install.sh | sh || { echo "⚠️ Ollama install failed — bot will use cloud providers"; exit 0; }
          echo "Starting Ollama server..."
          nohup ollama serve > /tmp/ollama.log 2>&1 &
          sleep 3
          # Wait for Ollama to be ready (30s timeout)
          for i in $(seq 1 30); do
            if curl -sf http://localhost:11434/api/tags > /dev/null 2>&1; then
              echo "✅ Ollama server is ready"
              break
            fi
            sleep 1
          done
          if ! curl -sf http://localhost:11434/api/tags > /dev/null 2>&1; then
            echo "⚠️ Ollama server failed to start — bot will use cloud providers"
            echo "Ollama log:"
            cat /tmp/ollama.log 2>/dev/null || true
            exit 0
          fi
          # Pull the vision model (qwen2.5vl:7b — vision-capable, ~4.7GB)
          MODEL="${OLLAMA_MODEL:-qwen2.5vl:7b}"
          echo "Pulling model: $MODEL (~4.7GB)..."
          ollama pull "$MODEL" || { echo "⚠️ Model pull failed — bot will use cloud providers"; exit 0; }
          echo "Available models:"
          ollama list || true

      # ─── Step 6: Run the bot (with 5h30m timeout) ───
      # The runner script starts Xvfb (virtual display for Chrome WebGL),
      # then starts the bot. After 5h30m, it gracefully shuts down and
      # the next step triggers the next iteration.
      #
      # v4: Also passes GHLOGS_* env vars + GITHUB_TOKEN so the in-process
      # github-log-shipper.ts can push live logs to the bot-logs branch.
      - name: Run MathU Bot
        env:
          # Bot credentials (login for app.mathu.co.za via Microsoft auth)
          MICROSOFT_EMAIL: ${{ secrets.MICROSOFT_EMAIL }}
          MICROSOFT_PASSWORD: ${{ secrets.MICROSOFT_PASSWORD }}
          # Turso database
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          # AI providers (at least one needed)
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          DEEPINFRA_API_KEY: ${{ secrets.DEEPINFRA_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          BRAIN_API_KEY: ${{ secrets.BRAIN_API_KEY }}
          # Cloudflare (Workers AI) — uses CF_ACCOUNT_ID + CF_API_KEY
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          # Screenshot storage (Cloudinary)
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          CLOUDINARY_FOLDER: ${{ secrets.CLOUDINARY_FOLDER }}
          # Chrome flags — full WebGL support (16GB RAM, no limits needed)
          CHROMIUM_FLAGS: "--no-sandbox --disable-setuid-sandbox --disable-dev-shm-usage --disable-extensions --disable-background-networking --disable-default-apps --disable-sync --disable-translate --use-gl=angle --use-angle=swiftshader --enable-unsafe-swiftshader --window-size=1280,800"
          DISPLAY: ":99"
          NODE_ENV: production
          PORT: 10000
          HEADLESS: true
          LOG_LEVEL: info
          SAVE_SCREENSHOTS: false
          DB_PATH: /tmp/mathu-bot.db
          USER_DATA_DIR: /tmp/.browser-data
          LOG_DIR: /tmp/mathu-logs
          # Tell the bot it's NOT on Render (don't force MINIMUM mode)
          RENDER: ""
          HF_SPACES: ""
          # Disable forced restarts (GitHub Actions handles timeout)
          MAX_UPTIME_HOURS: 0
          MAX_CYCLES_BEFORE_RESTART: 999999
          # ─── Ollama (local vision fallback — installed in Step 5.5) ───
          # AUDITOR_PROVIDER=ollama tells run-bot.sh to verify the server is
          # up before starting the bot. OLLAMA_MODEL pins the vision model
          # (must match what Step 5.5 pulled). The reachability probe in
          # providers-ollama.ts auto-detects the server on localhost:11434;
          # if Step 5.5 failed (continue-on-error), the probe fails and the
          # bot silently falls back to cloud providers.
          AUDITOR_PROVIDER: ollama
          OLLAMA_MODEL: qwen2.5vl:7b
          # ─── v4: GitHub log shipper (live logs → bot-logs branch) ───
          # PAT_TOKEN is optional here — the shipper falls back to the
          # auto-injected GITHUB_TOKEN (which works on Actions thanks to
          # `permissions: contents: write` above). Set PAT_TOKEN only if
          # you also run the bot on HF Spaces/Render, where there's no
          # auto-injected GITHUB_TOKEN.
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          GHLOGS_OWNER: ${{ github.repository_owner }}
          GHLOGS_REPO: ${{ github.event.repository.name }}
          GHLOGS_BRANCH: bot-logs
          GHLOGS_PATH: logs
        run: |
          chmod +x ./scripts/run-bot.sh
          ./scripts/run-bot.sh

      # ─── Step 7: Trigger the next iteration ───
      # v3: Uses the built-in GITHUB_TOKEN (no PAT needed!) to trigger a new
      # workflow_dispatch run of this same workflow via the GitHub CLI.
      # This is safer (auto-managed, expires after each run) and simpler.
      - name: Trigger next iteration
        if: always()  # Run even if the bot step failed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Triggering next MathU Bot Loop run..."
          gh workflow run mathu-bot-loop.yml \
            --repo ${{ github.repository }} \
            --ref ${{ github.ref_name }}
          echo "Next run triggered successfully."

      # ─── Step 8: Upload logs as artifact (v4) ───
      # Capture the full /tmp/mathu-logs/ directory (bot-stdout.log,
      # daemon.log, screenshots, traces) as a downloadable artifact so you
      # can grab the untruncated log from any specific run. Retained 90 days.
      - name: Upload logs as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bot-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/mathu-logs/
          retention-days: 90
          if-no-files-found: warn
          compression-level: 6
