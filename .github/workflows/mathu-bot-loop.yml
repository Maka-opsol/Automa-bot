# ═══════════════════════════════════════════════════════════════════════
# MathU Bot — Perpetual Loop GitHub Actions Workflow (v2 — uses GITHUB_TOKEN)
# ═══════════════════════════════════════════════════════════════════════
#
# v2: Replaced PAT_TOKEN + repository_dispatch with GITHUB_TOKEN + gh CLI.
# This is safer (auto-managed, expires after each run) and simpler (no PAT).
# ═══════════════════════════════════════════════════════════════════════

name: MathU Bot Loop

on:
  workflow_dispatch:
  repository_dispatch:
    types: [loop_trigger]

# Grant the GITHUB_TOKEN permission to trigger workflows
permissions:
  actions: write
  contents: read

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Chrome + WebGL dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libnss3 libnspr4 libatk1.0-0 libatk-bridge2.0-0 \
            libcups2 libdrm2 libxkbcommon0 libxcomposite1 \
            libxdamage1 libxrandr2 libgbm1 libpango-1.0-0 \
            libcairo2 libasound2 libxshmfence1 libx11-xcb1 \
            libxfixes3 libxext6 libxi6 libxtst6 \
            libxcursor1 libxss1 libdbus-1-3 libexpat1 \
            libglib2.0-0 \
            libvulkan1 mesa-vulkan-drivers \
            libgl1-mesa-dri libegl1 libegl-mesa0 libgl1 libgles2 \
            xvfb xauth
          sudo rm -rf /var/lib/apt/lists/*

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Install bot npm dependencies
        run: |
          npm install --ignore-scripts
          npm install --ignore-scripts @esbuild/linux-x64
          npm rebuild better-sqlite3

      - name: Run MathU Bot
        env:
          # Bot credentials
          MICROSOFT_EMAIL: ${{ secrets.MICROSOFT_EMAIL }}
          MICROSOFT_PASSWORD: ${{ secrets.MICROSOFT_PASSWORD }}
          # Turso database
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          # AI providers
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          DEEPINFRA_API_KEY: ${{ secrets.DEEPINFRA_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          BRAIN_API_KEY: ${{ secrets.BRAIN_API_KEY }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          # Screenshot storage
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          CLOUDINARY_FOLDER: ${{ secrets.CLOUDINARY_FOLDER }}
          # Chrome flags — full WebGL support
          CHROMIUM_FLAGS: "--no-sandbox --disable-setuid-sandbox --disable-dev-shm-usage --disable-extensions --disable-background-networking --disable-default-apps --disable-sync --disable-translate --use-gl=angle --use-angle=swiftshader --enable-unsafe-swiftshader --window-size=1280,800"
          DISPLAY: ":99"
          NODE_ENV: production
          PORT: 10000
          HEADLESS: true
          LOG_LEVEL: info
          SAVE_SCREENSHOTS: false
          DB_PATH: /tmp/mathu-bot.db
          USER_DATA_DIR: /tmp/.browser-data
          LOG_DIR: /tmp/mathu-logs
          RENDER: ""
          HF_SPACES: ""
          MAX_UPTIME_HOURS: 0
          MAX_CYCLES_BEFORE_RESTART: 999999
        run: |
          chmod +x ./scripts/run-bot.sh
          ./scripts/run-bot.sh

      # ─── Trigger next iteration using GITHUB_TOKEN (no PAT needed!) ───
      - name: Trigger next iteration
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Triggering next MathU Bot Loop run..."
          gh workflow run mathu-bot-loop.yml \
            --repo ${{ github.repository }} \
            --ref main
          echo "Next run triggered successfully."
