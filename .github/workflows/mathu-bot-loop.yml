# ═══════════════════════════════════════════════════════════════════════
# MathU Bot — Perpetual Loop GitHub Actions Workflow (v3 — improved logging)
# ═══════════════════════════════════════════════════════════════════════
#
# HOW THIS WORKS (plain English):
#
# GitHub Actions has a hard 6-hour limit per job. To run the bot 24/7,
# we use a "self-triggering loop":
#
#   1. This workflow starts and runs the bot for ~5.5 hours
#   2. Before the timeout, it triggers ANOTHER run of itself
#   3. The new run starts immediately, keeping the bot alive
#   4. Repeat forever
#
# MEMORY: GitHub's ubuntu-latest runners have 16GB RAM — plenty for
# Chrome + CanvasKit + the bot (peak ~600MB, 15.4GB free).
#
# COST: 
#   - Public repo: UNLIMITED free minutes ✅
#   - Private repo: 2,000 free minutes/month (~5.5 runs of 6 hours each)
#   - Recommendation: make the repo PUBLIC for unlimited free runs
#
# LOGGING FEATURES (v3):
#   - Live status every 2 minutes (last 10 bot log lines shown in Actions log)
#   - Memory usage logged every 10 minutes
#   - Full bot logs uploaded as downloadable artifacts after each run
#   - Logs retained for 7 days
#
# SETUP REQUIRED:
#   1. (Optional) Create a Personal Access Token (PAT) with "repo" scope
#      → https://github.com/settings/tokens
#      Add it as a repository secret named PAT_TOKEN
#      OR use the built-in GITHUB_TOKEN (see "Trigger next iteration" step)
#   2. Add all bot env vars as repository secrets (see SETUP.md)
# ═══════════════════════════════════════════════════════════════════════

name: MathU Bot Loop

# Triggers:
# - workflow_dispatch: manual start (you click "Run workflow" in GitHub)
# - repository_dispatch: triggered by the previous run before it times out
on:
  workflow_dispatch:
  repository_dispatch:
    types: [loop_trigger]

# Grant the GITHUB_TOKEN permission to trigger workflows (for the loop)
permissions:
  actions: write
  contents: read

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350  # 5h 50m — leaves 10 min for cleanup + trigger
    
    steps:
      # ─── Step 1: Check out the bot code ───
      - name: Checkout code
        uses: actions/checkout@v4

      # ─── Step 2: Set up Node.js ───
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ─── Step 3: Install Chrome + WebGL dependencies ───
      # Uses Playwright's official dependency installer (handles Ubuntu version differences)
      # Plus WebGL/Vulkan libraries for SwiftShader (CanvasKit needs WebGL)
      - name: Install Chrome + WebGL dependencies
        run: |
          # Playwright knows the exact packages Chrome needs for any Ubuntu version
          sudo npx playwright install-deps chromium
          # Also install WebGL/Vulkan libs (Playwright doesn't include these)
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libvulkan1 mesa-vulkan-drivers \
            libgl1-mesa-dri libegl1 libegl-mesa0 libgl1 libgles2 \
            xvfb xauth || true
          sudo rm -rf /var/lib/apt/lists/*

      # ─── Step 4: Install Playwright Chromium ───
      - name: Install Playwright Chromium
        run: npx playwright install chromium

      # ─── Step 5: Install bot dependencies ───
      - name: Install bot npm dependencies
        run: |
          npm install --ignore-scripts
          npm install --ignore-scripts @esbuild/linux-x64
          npm rebuild better-sqlite3

      # ─── Step 6: Run the bot (with 5h30m timeout) ───
      # The runner script starts Xvfb (virtual display for Chrome WebGL),
      # then starts the bot. After 5h30m, it gracefully shuts down and
      # triggers the next iteration.
      #
      # The runner script logs:
      #   - Status every 2 minutes (last 10 bot log lines)
      #   - Memory usage every 10 minutes
      #   - Full bot stdout to /tmp/mathu-logs/bot-stdout.log
      - name: Run MathU Bot
        env:
          # Bot credentials (login for app.mathu.co.za via Microsoft auth)
          MICROSOFT_EMAIL: ${{ secrets.MICROSOFT_EMAIL }}
          MICROSOFT_PASSWORD: ${{ secrets.MICROSOFT_PASSWORD }}
          # Turso database
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          # AI providers (at least one needed)
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          DEEPINFRA_API_KEY: ${{ secrets.DEEPINFRA_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          BRAIN_API_KEY: ${{ secrets.BRAIN_API_KEY }}
          # Cloudflare (Workers AI) — uses CF_ACCOUNT_ID + CF_API_KEY
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          # Screenshot storage (Cloudinary)
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          CLOUDINARY_FOLDER: ${{ secrets.CLOUDINARY_FOLDER }}
          # Chrome flags — full WebGL support (16GB RAM, no limits needed)
          CHROMIUM_FLAGS: "--no-sandbox --disable-setuid-sandbox --disable-dev-shm-usage --disable-extensions --disable-background-networking --disable-default-apps --disable-sync --disable-translate --use-gl=angle --use-angle=swiftshader --enable-unsafe-swiftshader --window-size=1280,800"
          DISPLAY: ":99"
          NODE_ENV: production
          PORT: 10000
          HEADLESS: true
          LOG_LEVEL: info
          SAVE_SCREENSHOTS: false
          DB_PATH: /tmp/mathu-bot.db
          USER_DATA_DIR: /tmp/.browser-data
          LOG_DIR: /tmp/mathu-logs
          # Tell the bot it's NOT on Render (don't force MINIMUM mode)
          RENDER: ""
          HF_SPACES: ""
          # Disable forced restarts (GitHub Actions handles timeout)
          MAX_UPTIME_HOURS: 0
          MAX_CYCLES_BEFORE_RESTART: 999999
        run: |
          chmod +x ./scripts/run-bot.sh
          ./scripts/run-bot.sh

      # ─── Step 7: Upload bot logs as artifact ───
      # This saves the full bot stdout log + screenshots so you can
      # download them after each run for debugging.
      - name: Upload bot logs
        if: always()  # Upload even if the bot crashed
        uses: actions/upload-artifact@v4
        with:
          name: bot-logs-${{ github.run_id }}
          path: |
            /tmp/mathu-logs/
          retention-days: 7
          if-no-files-found: warn

      # ─── Step 8: Trigger the next iteration ───
      # Uses the built-in GITHUB_TOKEN (no PAT needed!) to trigger a new
      # workflow_dispatch run of this same workflow.
      - name: Trigger next iteration
        if: always()  # Run even if the bot step failed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Triggering next MathU Bot Loop run..."
          gh workflow run mathu-bot-loop.yml \
            --repo ${{ github.repository }} \
            --ref main
          echo "Next run triggered successfully."
