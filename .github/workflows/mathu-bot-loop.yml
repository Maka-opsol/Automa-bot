# ═══════════════════════════════════════════════════════════════════════
# MathU Bot — Perpetual Loop GitHub Actions Workflow (v5.2 — patch management)
# ═══════════════════════════════════════════════════════════════════════
# v5.2: Added scheduled patch checks (12pm + 12am SAST)
# v5.1: Added DASHBOARD_URL/DASHBOARD_KEY env vars for Render dashboard
#
# TIER 1 UPGRADE — we have 16GB RAM, so we're going all-in:
#
#   ✅ FULL POWER mode — all 35+ subsystems enabled (self-heal, resilience,
#      longevity, pixel training, blackbox replay, model evolution, etc.)
#   ✅ Pix2Text + Torch — local OCR for math equations (no API calls needed)
#   ✅ Playwright trace recording — every click/page-load recorded for replay
#   ✅ Full Chrome with WebGL — CanvasKit renders properly, no more blank pages
#   ✅ Detailed logging — status every 2 min, memory every 10 min, artifacts
#
# MEMORY BUDGET (16GB GitHub runner):
#   Bot orchestrator (FULL POWER):  ~250MB
#   Chrome + SwiftShader:           ~220MB
#   CanvasKit compile spike:        ~150MB (transient)
#   Pix2Text + Torch (local OCR):  ~500MB (when active)
#   Playwright trace buffer:        ~50MB
#   Total peak:                    ~1170MB → 14.8GB free ✅
#
# COST: 
#   - Public repo: UNLIMITED free minutes ✅
#   - Private repo: 2,000 free minutes/month (~5.5 runs of 6 hours each)
#
# LOGGING:
#   - Live status every 2 minutes (last 10 bot log lines)
#   - Memory usage every 10 minutes
#   - Full bot logs + Playwright traces uploaded as artifacts
#   - Artifacts retained for 7 days
# ═══════════════════════════════════════════════════════════════════════

name: MathU Bot Loop

on:
  workflow_dispatch:
  repository_dispatch:
    types: [loop_trigger]

permissions:
  actions: write
  contents: read

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350  # 5h 50m
    environment: Automa-bot  # Required to load environment secrets (see Settings → Environments)
    
    steps:
      # ─── Step 1: Check out the bot code ───
      - name: Checkout code
        uses: actions/checkout@v4

      # ─── Step 2: Set up Node.js ───
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ─── Step 3: Set up Python (for Pix2Text + Torch local OCR) ───
      # Pix2Text is a Python library that does OCR on math equations.
      # It's more accurate than Tesseract for math and works offline.
      # With 16GB RAM, we can afford the ~500MB memory cost.
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ─── Step 4: Install Chrome + WebGL dependencies ───
      - name: Install Chrome + WebGL dependencies
        run: |
          sudo npx playwright install-deps chromium
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libvulkan1 mesa-vulkan-drivers \
            libgl1-mesa-dri libegl1 libegl-mesa0 libgl1 libgles2 \
            xvfb xauth || true
          sudo rm -rf /var/lib/apt/lists/*

      # ─── Step 5: Install Pix2Text + Torch (local OCR) ───
      # Pix2Text has a dependency conflict with rapidocr 3.10+.
      # Fix: install pix2text first, then FORCE downgrade rapidocr to 3.9.1.
      # The entire step is non-fatal — if it fails, the bot continues without local OCR.
      - name: Install Pix2Text + Torch
        run: |
          pip install --no-cache-dir torch torchvision --index-url https://download.pytorch.org/whl/cpu || true
          pip install --no-cache-dir pix2text || true
          # Force downgrade rapidocr AFTER pix2text (pix2text pulls 3.10 which is broken)
          pip install --no-cache-dir "rapidocr==3.9.1" --force-reinstall || true
          # Verify — non-fatal
          python -c "import pix2text" 2>/dev/null && echo "✅ Pix2Text OK" || echo "⚠️ Pix2Text unavailable — bot will use cloud OCR"
          # Clean up pip cache to free disk space for Ollama models
          pip cache purge 2>/dev/null || true
          rm -rf ~/.cache/pip /tmp/pip-* 2>/dev/null || true
          df -h / | tail -1

      # ─── Step 6: Install Playwright Chromium ───
      - name: Install Playwright Chromium
        run: npx playwright install chromium

      # ─── Step 6.5: Install Ollama + pull self-heal LLM ───
      # TIER 1+: Self-hosted LLM for self-heal code review.
      # Runs qwen2.5-coder:7b locally — no API calls, no rate limits.
      # The bot's auditor calls http://localhost:11434/v1/chat/completions
      # Non-fatal — if Ollama fails, the auditor falls back to cloud providers.
      - name: Setup Ollama + self-heal LLM
        run: |
          echo "Installing Ollama..."
          curl -fsSL https://ollama.com/install.sh | sh || true
          echo "Starting Ollama server..."
          nohup ollama serve > /tmp/ollama.log 2>&1 &
          sleep 3
          # Wait for Ollama to be ready
          for i in $(seq 1 30); do
            if curl -sf http://localhost:11434/api/tags > /dev/null 2>&1; then
              echo "✅ Ollama server is ready"
              break
            fi
            sleep 1
          done
          if ! curl -sf http://localhost:11434/api/tags > /dev/null 2>&1; then
            echo "⚠️ Ollama server failed to start — auditor will use cloud fallback"
            echo "Ollama log:"
            cat /tmp/ollama.log 2>/dev/null || true
          else
            # Pull ONE model that handles BOTH vision + code review.
            # llava:7b can analyze screenshots AND review code — no need for
            # a separate qwen2.5-coder model (saves ~4.7GB disk space).
            # GitHub runners have ~7GB free — one model fits, two don't.
            MODEL="llava:7b"
            echo "Pulling model: $MODEL (~4.7GB)..."
            ollama pull "$MODEL" || true
            echo "Available models:"
            ollama list || true
          fi

      # ─── Step 7: Install bot dependencies ───
      # TIER 1+: Install ALL optional deps (onnxruntime-node, @xenova/transformers)
      # for local VLM (Phi-3.5-vision) + GAN telemetry. We have 16GB RAM.
      - name: Install bot npm dependencies
        run: |
          npm install --ignore-scripts
          npm install --ignore-scripts @esbuild/linux-x64
          # TIER 1+: Install optional deps for local VLM + GAN telemetry
          # Note: @xenova/transformers depends on sharp (native image lib).
          # --ignore-scripts skips sharp's build, so we rebuild it explicitly.
          npm install --ignore-scripts onnxruntime-node @xenova/transformers || true
          # Rebuild sharp native binary (required for @xenova/transformers)
          npm rebuild sharp || npm install --build-from-source sharp || true
          npm rebuild better-sqlite3

      # ─── Step 8: Run the bot (FULL POWER mode, 5h30m timeout) ───
      # TIER 1: All subsystems enabled, Playwright tracing active.
      # The bot runs in FULL POWER mode because RENDER env var is empty
      # (not set), so memory-mode.ts won't force MINIMUM mode.
      - name: Run MathU Bot
        env:
          # Bot credentials
          MICROSOFT_EMAIL: ${{ secrets.MICROSOFT_EMAIL }}
          MICROSOFT_PASSWORD: ${{ secrets.MICROSOFT_PASSWORD }}
          # Turso database
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          # AI providers
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          DEEPINFRA_API_KEY: ${{ secrets.DEEPINFRA_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          BRAIN_API_KEY: ${{ secrets.BRAIN_API_KEY }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          # Screenshot storage
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          CLOUDINARY_FOLDER: ${{ secrets.CLOUDINARY_FOLDER }}
          # TIER 1: Chrome flags — full WebGL, no memory limits
          # Re-enabled: SharedArrayBuffer, BackForwardCache (were disabled for Render)
          # Kept: SwiftShader WebGL (GitHub runners don't have real GPUs)
          # TIER 1+: Chrome flags — full rendering, no blank pages
          # headless:'new' mode + Xvfb + SwiftShader = proper CanvasKit rendering
          # NO --disable-gpu (kills WebGL) — software GPU via SwiftShader instead
          CHROMIUM_FLAGS: "--no-sandbox --disable-setuid-sandbox --disable-dev-shm-usage --disable-extensions --disable-background-networking --disable-default-apps --disable-sync --disable-translate --use-gl=angle --use-angle=swiftshader --enable-unsafe-swiftshader --ignore-gpu-blocklist --window-size=1280,800"
          DISPLAY: ":99"
          NODE_ENV: production
          PORT: 10000
          HEADLESS: true
          LOG_LEVEL: info
          SAVE_SCREENSHOTS: false
          DB_PATH: /tmp/mathu-bot.db
          USER_DATA_DIR: /tmp/.browser-data
          LOG_DIR: /tmp/mathu-logs
          # TIER 1+: Live dashboard on Render — ship logs, stats, screenshots
          # Set DASHBOARD_URL to your Render URL (e.g., https://mathu-bot.onrender.com)
          # Leave empty to disable (logs only go to artifacts)
          DASHBOARD_URL: ${{ secrets.DASHBOARD_URL }}
          DASHBOARD_KEY: ${{ secrets.DASHBOARD_KEY }}
          # v5.2: Scheduled patch system — bot checks dashboard for patches at 12pm and 12am SAST
          # Toqi/Zapia submit patches via the dashboard, bot applies them at scheduled times
          SCHEDULED_PATCH_TIMES: "12,0"  # 12pm and 12am (SAST hours)
          SCHEDULED_PATCH_TIMEZONE: "Africa/Johannesburg"
          # TIER 1: FULL POWER mode — do NOT set RENDER, so memory-mode
          # won't force MINIMUM mode. All 35+ subsystems will start.
          # RENDER is intentionally NOT set here.
          # TIER 1: Enable Playwright trace recording
          ENABLE_TRACING: "true"
          TRACE_DIR: /tmp/mathu-logs/traces
          # TIER 1: Enable local OCR (Pix2Text)
          ENABLE_LOCAL_OCR: "true"
          # TIER 1+: Enable GAN telemetry (mouse movement GAN — was disabled on Render)
          ENABLE_GAN_TELEMETRY: "true"
          GAN_MODEL_PATH: "./models/mouse-gan.onnx"
          # TIER 1+: Disable local VLM — HuggingFace returns 401 on model download.
          # Ollama (llava:7b) handles vision locally instead.
          ENABLE_LOCAL_VLM: "false"
          # TIER 2: Parallel browser mode — 3 browser contexts solving questions simultaneously
          # Each worker has its own context + page, shares one Chrome process.
          # 3× throughput vs single browser mode.
          # Set to 1 to disable parallel mode (use single browser).
          PARALLEL_WORKERS: "3"
          # TIER 1+: Self-hosted LLM for self-heal (Ollama running locally)
          # Uses llava:7b for BOTH code review AND vision (one model, saves disk)
          AUDITOR_USE_ACTIVE: "false"
          AUDITOR_PROVIDER: "ollama"
          AUDITOR_MODEL: "llava:7b"
          AUDITOR_API_KEY: "ollama"
          AUDITOR_ENDPOINT: "http://localhost:11434/v1/chat/completions"
          # Ollama provider config — both text and vision use llava:7b
          OLLAMA_MODEL: "llava:7b"
          OLLAMA_VISION_MODEL: "llava:7b"
          # Disable forced restarts (GitHub Actions handles timeout)
          MAX_UPTIME_HOURS: 0
          MAX_CYCLES_BEFORE_RESTART: 999999
        run: |
          chmod +x ./scripts/run-bot.sh
          ./scripts/run-bot.sh

      # ─── Step 9: Upload bot logs as artifact ───
      - name: Upload bot logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bot-logs-${{ github.run_id }}
          path: |
            /tmp/mathu-logs/
            !/tmp/mathu-logs/traces/*.zip
          retention-days: 7
          if-no-files-found: warn

      # ─── Step 10: Upload Playwright traces (separate artifact) ───
      # TIER 1: Playwright traces let you "replay" what the bot did.
      # Download the trace.zip, then run: npx playwright show-trace trace.zip
      - name: Upload Playwright traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces-${{ github.run_id }}
          path: /tmp/mathu-logs/traces/
          retention-days: 7
          if-no-files-found: warn

      # ─── Step 11: Trigger the next iteration ───
      # ONLY trigger on SUCCESS. If the bot crashed or setup failed, the loop
      # stops — this prevents chain reactions of 300+ failed runs.
      # The user can manually click "Run workflow" to restart the loop.
      - name: Trigger next iteration
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Triggering next MathU Bot Loop run..."
          gh workflow run mathu-bot-loop.yml \
            --repo ${{ github.repository }} \
            --ref main
          echo "Next run triggered successfully."
