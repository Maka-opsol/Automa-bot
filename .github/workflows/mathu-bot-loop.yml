# ═══════════════════════════════════════════════════════════════════════
# MathU Bot — Perpetual Loop GitHub Actions Workflow (v3)
# ═══════════════════════════════════════════════════════════════════════
#
# v3 changes:
#   - Uses GITHUB_TOKEN (auto-managed, no PAT needed) instead of PAT_TOKEN
#   - Uses Playwright's install-deps command (handles Ubuntu 24.04 package renames)
#   - Upgraded Node.js to 22 (silences deprecation warning)
#
# HOW THIS WORKS:
#   1. This workflow starts and runs the bot for ~5.5 hours
#   2. Before timeout, it triggers ANOTHER run of itself using gh CLI + GITHUB_TOKEN
#   3. The new run starts immediately, keeping the bot alive
#   4. Repeat forever
#
# MEMORY: GitHub's ubuntu-latest runners have 16GB RAM — plenty for
# Chrome + CanvasKit + the bot (peak ~600MB, 15.4GB free).
#
# COST: 
#   - Public repo: UNLIMITED free minutes ✅
#   - Private repo: 2,000 free minutes/month (~5.5 runs of 6 hours each)
#   - Recommendation: make the repo PUBLIC for unlimited free runs
#
# SETUP REQUIRED:
#   1. Add all bot env vars as repository secrets (see setup guide)
#   2. NO Personal Access Token needed — uses built-in GITHUB_TOKEN
#   3. Click "Run workflow" in the Actions tab to start the loop
# ═══════════════════════════════════════════════════════════════════════

name: MathU Bot Loop

# Triggers:
# - workflow_dispatch: manual start (you click "Run workflow" in GitHub)
# - repository_dispatch: triggered by the previous run before it times out
#   (kept for backwards compatibility, but we now use gh CLI for triggering)
on:
  workflow_dispatch:
  repository_dispatch:
    types: [loop_trigger]

# Grant the GITHUB_TOKEN permission to trigger workflows
permissions:
  actions: write
  contents: read

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350  # 5h 50m — leaves 10 min for cleanup + trigger
    
    steps:
      # ─── Step 1: Check out the bot code ───
      - name: Checkout code
        uses: actions/checkout@v4

      # ─── Step 2: Set up Node.js 22 ───
      # v3: Upgraded from 20 to 22 to silence deprecation warning
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # ─── Step 3: Install Chrome + WebGL dependencies ───
      # v3: Uses Playwright's install-deps command which knows the correct
      # package names for any Ubuntu version (handles 22.04 vs 24.04 differences
      # like libasound2 vs libasound2t64 automatically).
      # Then adds WebGL/Vulkan/Xvfb packages separately (Playwright doesn't include these).
      - name: Install Chrome + WebGL dependencies
        run: |
          # Playwright knows the exact packages Chrome needs for any Ubuntu version
          sudo npx playwright install-deps chromium
          # Also install WebGL/Vulkan/Xvfb libs (Playwright doesn't include these)
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libvulkan1 mesa-vulkan-drivers \
            libgl1-mesa-dri libegl1 libegl-mesa0 libgl1 libgles2 \
            xvfb xauth || true
          sudo rm -rf /var/lib/apt/lists/*

      # ─── Step 4: Install Playwright Chromium ───
      - name: Install Playwright Chromium
        run: npx playwright install chromium

      # ─── Step 5: Install bot dependencies ───
      - name: Install bot npm dependencies
        run: |
          npm install --ignore-scripts
          npm install --ignore-scripts @esbuild/linux-x64
          npm rebuild better-sqlite3

      # ─── Step 6: Run the bot (with 5h30m timeout) ───
      # The runner script starts Xvfb (virtual display for Chrome WebGL),
      # then starts the bot. After 5h30m, it gracefully shuts down and
      # the next step triggers the next iteration.
      - name: Run MathU Bot
        env:
          # Bot credentials (login for app.mathu.co.za via Microsoft auth)
          MICROSOFT_EMAIL: ${{ secrets.MICROSOFT_EMAIL }}
          MICROSOFT_PASSWORD: ${{ secrets.MICROSOFT_PASSWORD }}
          # Turso database
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          # AI providers (at least one needed)
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          DEEPINFRA_API_KEY: ${{ secrets.DEEPINFRA_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          BRAIN_API_KEY: ${{ secrets.BRAIN_API_KEY }}
          # Cloudflare (Workers AI) — uses CF_ACCOUNT_ID + CF_API_KEY
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          # Screenshot storage (Cloudinary)
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          CLOUDINARY_FOLDER: ${{ secrets.CLOUDINARY_FOLDER }}
          # Chrome flags — full WebGL support (16GB RAM, no limits needed)
          CHROMIUM_FLAGS: "--no-sandbox --disable-setuid-sandbox --disable-dev-shm-usage --disable-extensions --disable-background-networking --disable-default-apps --disable-sync --disable-translate --use-gl=angle --use-angle=swiftshader --enable-unsafe-swiftshader --window-size=1280,800"
          DISPLAY: ":99"
          NODE_ENV: production
          PORT: 10000
          HEADLESS: true
          LOG_LEVEL: info
          SAVE_SCREENSHOTS: false
          DB_PATH: /tmp/mathu-bot.db
          USER_DATA_DIR: /tmp/.browser-data
          LOG_DIR: /tmp/mathu-logs
          # Tell the bot it's NOT on Render (don't force MINIMUM mode)
          RENDER: ""
          HF_SPACES: ""
          # Disable forced restarts (GitHub Actions handles timeout)
          MAX_UPTIME_HOURS: 0
          MAX_CYCLES_BEFORE_RESTART: 999999
        run: |
          chmod +x ./scripts/run-bot.sh
          ./scripts/run-bot.sh

      # ─── Step 7: Trigger the next iteration ───
      # v3: Uses the built-in GITHUB_TOKEN (no PAT needed!) to trigger a new
      # workflow_dispatch run of this same workflow via the GitHub CLI.
      # This is safer (auto-managed, expires after each run) and simpler.
      - name: Trigger next iteration
        if: always()  # Run even if the bot step failed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Triggering next MathU Bot Loop run..."
          gh workflow run mathu-bot-loop.yml \
            --repo ${{ github.repository }} \
            --ref ${{ github.ref_name }}
          echo "Next run triggered successfully."
