name: Narrow CI checks (not staged validation)

# Do not use pull_request_target: this workflow checks out untrusted PR code.
on:
  pull_request:

# All unspecified token permissions are disabled. No environment or secrets.
permissions:
  contents: read

jobs:
  isolated-regressions:
    name: JS syntax and mocked critical-check tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out PR merge commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check runner and tracked JavaScript syntax
        shell: bash
        run: |
          timeout 40s bash -euo pipefail -c '
            node --version
            node -e '\''if (Number(process.versions.node.split(".")[0]) < 20) process.exit(1)'\''
            mapfile -d "" files < <(git ls-files -z -- "*.js")
            if (( ${#files[@]} == 0 )); then
              echo "No tracked JavaScript files found; refusing a vacuous pass." >&2
              exit 1
            fi
            printf "%s\0" "${files[@]}" | xargs -0 -n1 -P4 node --check
            echo "Syntax checked ${#files[@]} JavaScript files (not TypeScript)."
          '
      - name: Run mocked critical-check tests
        run: timeout 40s node --test tests/patch-validation-regression.test.js
