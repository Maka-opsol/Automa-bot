name: Dashboard Auditor
# Keyless AI advisory for anonymous dashboard patches. The dashboard
# (actions-auditor.js) dispatches this run with a per-patch nonce + base64-encoded
# candidate. The run executes three INDEPENDENT Ollama reviews (security /
# correctness / intent — different prompts + temperatures, mirroring the dashboard's
# _aiProviders OLLAMA_VARIANTS), aggregates the verdicts, and uploads
# dashboard-audit-verdict.json as an artifact named audit-<nonce>.
#
# The dashboard never holds an AI API key: Ollama runs here, in GitHub Actions,
# using the runner's own CPU. Swap OLLAMA_MODEL below for a larger model if your
# runner has the budget (a GPU runner + qwen2.5-coder:7b improves review quality).
on:
  workflow_dispatch:
    inputs:
      nonce:
        description: 'Per-patch nonce (64 hex chars, from the dashboard)'
        required: true
        type: string
      path:
        description: 'Patch file path (e.g. src/utils-sleep.ts)'
        required: true
        type: string
      base_blob:
        description: 'Baseline git blob SHA-1 (the reviewedSha the dashboard pinned)'
        required: true
        type: string
      candidate_b64:
        description: 'Candidate file content, base64-encoded'
        required: true
        type: string

permissions:
  contents: read

jobs:
  audit:
    name: audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OLLAMA_MODEL: qwen2.5-coder:1.5b
    steps:
      - name: Decode candidate + compute candidate_sha256
        env:
          CANDIDATE_B64: ${{ inputs.candidate_b64 }}
        run: |
          set -euo pipefail
          printf '%s' "$CANDIDATE_B64" | base64 -d > /tmp/candidate
          sha256sum /tmp/candidate | awk '{print $1}' > /tmp/candidate.sha256
          echo "candidate bytes: $(wc -c < /tmp/candidate)"

      - name: Install Ollama
        run: curl -fsSL https://ollama.com/install.sh | sh

      - name: Start Ollama server + wait for readiness
        run: |
          ollama serve > /tmp/ollama.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:11434/api/tags >/dev/null 2>&1; then echo "ollama ready"; exit 0; fi
            sleep 1
          done
          echo "ollama did not become ready"; cat /tmp/ollama.log; exit 1

      - name: Pull review model
        run: ollama pull "$OLLAMA_MODEL"

      - name: Run three independent Ollama reviews + build verdict
        env:
          NONCE: ${{ inputs.nonce }}
          PATH_IN: ${{ inputs.path }}
          BASE_BLOB: ${{ inputs.base_blob }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json, os, urllib.request, time
          model = os.environ["OLLAMA_MODEL"]
          with open("/tmp/candidate") as f: code = f.read()
          with open("/tmp/candidate.sha256") as f: candidate_sha256 = f.read().strip()
          # Three genuinely independent reviews — different system prompts + temperatures.
          # The provider names MUST match what the dashboard reports in its votes; the
          # dashboard only requires >=2 uniquely-named providers (no hard-coded list).
          variants = [
            ("ollama#security", 0.1,
             "You are auditing this code for SECURITY threats only: backdoors, data exfiltration, credential theft, hardcoded secrets, command injection, path traversal. Be strict but precise."),
            ("ollama#correctness", 0.3,
             "You are auditing this code for CORRECTNESS only: syntax errors, undefined references, broken logic, missing awaits, unhandled exceptions. Be thorough."),
            ("ollama#intent", 0.5,
             "You are auditing this code for DISGUISED MALICIOUS INTENT: obfuscation, time-bombs, conditional backdoors, safety-check weakening, social engineering in names/comments. Be skeptical."),
          ]
          providers = []
          all_safe = True
          for name, temp, system in variants:
            prompt = ("Review the following code patch for your assigned concern. "
                      "If you find NO issues, reply with exactly this JSON and nothing else: "
                      "{\"safe\": true}. If you find an issue, reply with exactly: "
                      "{\"safe\": false, \"reason\": \"<one short line>\"}. "
                      "Output ONLY the JSON object.\n\n```\n" + code + "\n```")
            body = json.dumps({"model": model, "prompt": prompt, "system": system,
                               "stream": False, "options": {"temperature": temp}}).encode()
            req = urllib.request.Request("http://localhost:11434/api/generate", data=body,
                                         headers={"Content-Type": "application/json"})
            parsed = None
            text = ""
            for attempt in range(3):
              try:
                with urllib.request.urlopen(req, timeout=180) as r:
                  resp = json.loads(r.read().decode())
                text = (resp.get("response") or "").strip()
                s, e = text.find("{"), text.rfind("}")
                if s >= 0 and e > s:
                  parsed = json.loads(text[s:e+1])
                break
              except Exception:
                time.sleep(3)
            if not isinstance(parsed, dict) or parsed.get("safe") is not True:
              all_safe = False
              if parsed is None:
                print(f"[{name}] FAILED to parse a JSON verdict from the model response (treating as unsafe — fail-closed); raw response was: {text!r}")
              else:
                print(f"[{name}] NOT safe: {parsed!r}")
            else:
              print(f"[{name}] safe")
            providers.append(name)
          # Exact 11-key structure the dashboard's verdict validator expects
          # (base_blob,candidate_sha256,job,nonce,path,providers,run_attempt,run_id,safe,version,workflow_sha).
          verdict = {
            "base_blob": os.environ["BASE_BLOB"],
            "candidate_sha256": candidate_sha256,
            "job": "audit",
            "nonce": os.environ["NONCE"],
            "path": os.environ["PATH_IN"],
            "providers": providers,
            "run_attempt": int(os.environ["RUN_ATTEMPT"]),
            "run_id": os.environ["RUN_ID"],
            "safe": bool(all_safe),
            "version": 1,
            "workflow_sha": os.environ["WORKFLOW_SHA"],
          }
          with open("dashboard-audit-verdict.json", "w") as f:
            json.dump(verdict, f, separators=(",", ":"))
          print(json.dumps(verdict, indent=2))
          PY

      - name: Upload verdict artifact (audit-<nonce>)
        uses: actions/upload-artifact@v4
        with:
          name: audit-${{ inputs.nonce }}
          path: dashboard-audit-verdict.json
          retention-days: 1
          overwrite: true
