# ═══════════════════════════════════════════════════════════════════════
# MathU Bot — Perpetual Loop GitHub Actions Workflow
# ═══════════════════════════════════════════════════════════════════════
#
# HOW THIS WORKS (plain English):
#
# GitHub Actions has a hard 6-hour limit per job. To run the bot 24/7,
# we use a "self-triggering loop":
#
#   1. This workflow starts and runs the bot for ~5.5 hours
#   2. 5 minutes before the timeout, it triggers ANOTHER run of itself
#   3. The new run starts immediately, keeping the bot alive
#   4. Repeat forever
#
# MEMORY: GitHub's ubuntu-latest runners have 16GB RAM — plenty for
# Chrome + CanvasKit + the bot (peak ~600MB, 15.4GB free).
#
# COST: 
#   - Public repo: UNLIMITED free minutes ✅
#   - Private repo: 2,000 free minutes/month (~5.5 runs of 6 hours each)
#   - Recommendation: make the repo PUBLIC for unlimited free runs
#
# SETUP REQUIRED:
#   1. Create a Personal Access Token (PAT) with "repo" scope
#      → https://github.com/settings/tokens
#   2. Add it as a repository secret named PAT_TOKEN
#   3. Add all bot env vars as repository secrets (see setup guide)
# ═══════════════════════════════════════════════════════════════════════

name: MathU Bot Loop

# Triggers:
# - workflow_dispatch: manual start (you click "Run workflow" in GitHub)
# - repository_dispatch: triggered by the previous run before it times out
on:
  workflow_dispatch:
  repository_dispatch:
    types: [loop_trigger]

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350  # 5h 50m — leaves 10 min for cleanup + trigger
    
    steps:
      # ─── Step 1: Check out the bot code ───
      - name: Checkout code
        uses: actions/checkout@v4

      # ─── Step 2: Set up Node.js 20 ───
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ─── Step 3: Install Chrome dependencies ───
      # GitHub's ubuntu-latest already has Chrome installed, but we need
      # the shared libraries for Playwright's Chromium + SwiftShader (WebGL)
      - name: Install Chrome + WebGL dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libnss3 libnspr4 libatk1.0-0 libatk-bridge2.0-0 \
            libcups2 libdrm2 libxkbcommon0 libxcomposite1 \
            libxdamage1 libxrandr2 libgbm1 libpango-1.0-0 \
            libcairo2 libasound2 libxshmfence1 libx11-xcb1 \
            libxfixes3 libxext6 libxi6 libxtst6 \
            libxcursor1 libxss1 libdbus-1-3 libexpat1 \
            libglib2.0-0 \
            libvulkan1 mesa-vulkan-drivers \
            libgl1-mesa-dri libegl1 libegl-mesa0 libgl1 libgles2 \
            xvfb xauth
          sudo rm -rf /var/lib/apt/lists/*

      # ─── Step 4: Install Playwright Chromium ───
      - name: Install Playwright Chromium
        run: npx playwright install chromium

      # ─── Step 5: Install bot dependencies ───
      - name: Install bot npm dependencies
        run: |
          npm install --ignore-scripts
          npm install --ignore-scripts @esbuild/linux-x64
          npm rebuild better-sqlite3

      # ─── Step 6: Run the bot (with 5h30m timeout) ───
      # The runner script starts Xvfb (virtual display for Chrome WebGL),
      # then starts the bot. After 5h30m, it gracefully shuts down and
      # triggers the next iteration.
      - name: Run MathU Bot
        env:
          # Bot credentials
          MATHU_USERNAME: ${{ secrets.MATHU_USERNAME }}
          MATHU_PASSWORD: ${{ secrets.MATHU_PASSWORD }}
          # Turso database
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          # AI providers (at least one needed)
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          # Screenshot storage (optional)
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          # GitHub token for self-triggering the next run
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          # Chrome flags — full WebGL support (16GB RAM, no limits needed)
          CHROMIUM_FLAGS: "--no-sandbox --disable-setuid-sandbox --disable-dev-shm-usage --disable-extensions --disable-background-networking --disable-default-apps --disable-sync --disable-translate --use-gl=angle --use-angle=swiftshader --enable-unsafe-swiftshader --window-size=1280,800"
          DISPLAY: ":99"
          NODE_ENV: production
          PORT: 10000
          HEADLESS: true
          LOG_LEVEL: info
          SAVE_SCREENSHOTS: false
          DB_PATH: /tmp/mathu-bot.db
          USER_DATA_DIR: /tmp/.browser-data
          LOG_DIR: /tmp/mathu-logs
          # Tell the bot it's NOT on Render (don't force MINIMUM mode)
          RENDER: ""
          HF_SPACES: ""
          # Disable forced restarts (GitHub Actions handles timeout)
          MAX_UPTIME_HOURS: 0
          MAX_CYCLES_BEFORE_RESTART: 999999
        run: |
          chmod +x ./scripts/run-bot.sh
          ./scripts/run-bot.sh

      # ─── Step 7: Trigger the next iteration ───
      # This fires a repository_dispatch event that starts this same workflow
      # again. The new run starts immediately, keeping the bot alive.
      - name: Trigger next iteration
        if: always()  # Run even if the bot step failed
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.PAT_TOKEN }}
          event-type: loop_trigger
          client-payload: |
            {"previous_run_id": "${{ github.run_id }}", "timestamp": "${{ github.event.head_commit.timestamp }}"}
