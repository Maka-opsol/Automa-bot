# ═══════════════════════════════════════════════════════════════════════
# MathU Bot — Perpetual Loop GitHub Actions Workflow (v4 — TIER 1 UPGRADE)
# ═══════════════════════════════════════════════════════════════════════
#
# TIER 1 UPGRADE — we have 16GB RAM, so we're going all-in:
#
#   ✅ FULL POWER mode — all 35+ subsystems enabled (self-heal, resilience,
#      longevity, pixel training, blackbox replay, model evolution, etc.)
#   ✅ Pix2Text + Torch — local OCR for math equations (no API calls needed)
#   ✅ Playwright trace recording — every click/page-load recorded for replay
#   ✅ Full Chrome with WebGL — CanvasKit renders properly, no more blank pages
#   ✅ Detailed logging — status every 2 min, memory every 10 min, artifacts
#
# MEMORY BUDGET (16GB GitHub runner):
#   Bot orchestrator (FULL POWER):  ~250MB
#   Chrome + SwiftShader:           ~220MB
#   CanvasKit compile spike:        ~150MB (transient)
#   Pix2Text + Torch (local OCR):  ~500MB (when active)
#   Playwright trace buffer:        ~50MB
#   Total peak:                    ~1170MB → 14.8GB free ✅
#
# COST: 
#   - Public repo: UNLIMITED free minutes ✅
#   - Private repo: 2,000 free minutes/month (~5.5 runs of 6 hours each)
#
# LOGGING:
#   - Live status every 2 minutes (last 10 bot log lines)
#   - Memory usage every 10 minutes
#   - Full bot logs + Playwright traces uploaded as artifacts
#   - Artifacts retained for 7 days
# ═══════════════════════════════════════════════════════════════════════

name: MathU Bot Loop

on:
  workflow_dispatch:
  repository_dispatch:
    types: [loop_trigger]

permissions:
  actions: write
  contents: read

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350  # 5h 50m
    
    steps:
      # ─── Step 1: Check out the bot code ───
      - name: Checkout code
        uses: actions/checkout@v4

      # ─── Step 2: Set up Node.js ───
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ─── Step 3: Set up Python (for Pix2Text + Torch local OCR) ───
      # Pix2Text is a Python library that does OCR on math equations.
      # It's more accurate than Tesseract for math and works offline.
      # With 16GB RAM, we can afford the ~500MB memory cost.
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ─── Step 4: Install Chrome + WebGL dependencies ───
      - name: Install Chrome + WebGL dependencies
        run: |
          sudo npx playwright install-deps chromium
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libvulkan1 mesa-vulkan-drivers \
            libgl1-mesa-dri libegl1 libegl-mesa0 libgl1 libgles2 \
            xvfb xauth || true
          sudo rm -rf /var/lib/apt/lists/*

      # ─── Step 5: Install Pix2Text + Torch (local OCR) ───
      # TIER 1: Restored local OCR. Saves API calls and works offline.
      # Torch CPU + Pix2Text = ~2GB disk, ~500MB RAM when active.
      - name: Install Pix2Text + Torch
        run: |
          pip install --no-cache-dir torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install --no-cache-dir pix2text
          echo "Pix2Text installed successfully"
          python -c "import pix2text; print(f'Pix2Text version: {pix2text.__version__}')"

      # ─── Step 6: Install Playwright Chromium ───
      - name: Install Playwright Chromium
        run: npx playwright install chromium

      # ─── Step 6.5: Install Ollama + pull self-heal LLM ───
      # TIER 1+: Self-hosted LLM for self-heal code review.
      # Runs qwen2.5-coder:7b locally — no API calls, no rate limits.
      # The bot's auditor calls http://localhost:11434/v1/chat/completions
      - name: Setup Ollama + self-heal LLM
        run: |
          chmod +x ./scripts/setup-ollama.sh
          ./scripts/setup-ollama.sh

      # ─── Step 7: Install bot dependencies ───
      # TIER 1+: Install ALL optional deps (onnxruntime-node, @xenova/transformers)
      # for local VLM (Phi-3.5-vision) + GAN telemetry. We have 16GB RAM.
      - name: Install bot npm dependencies
        run: |
          npm install --ignore-scripts
          npm install --ignore-scripts @esbuild/linux-x64
          # TIER 1+: Install optional deps for local VLM + GAN telemetry
          npm install --ignore-scripts onnxruntime-node @xenova/transformers || true
          npm rebuild better-sqlite3

      # ─── Step 8: Run the bot (FULL POWER mode, 5h30m timeout) ───
      # TIER 1: All subsystems enabled, Playwright tracing active.
      # The bot runs in FULL POWER mode because RENDER env var is empty
      # (not set), so memory-mode.ts won't force MINIMUM mode.
      - name: Run MathU Bot
        env:
          # Bot credentials
          MICROSOFT_EMAIL: ${{ secrets.MICROSOFT_EMAIL }}
          MICROSOFT_PASSWORD: ${{ secrets.MICROSOFT_PASSWORD }}
          # Turso database
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          # AI providers
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          DEEPINFRA_API_KEY: ${{ secrets.DEEPINFRA_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          BRAIN_API_KEY: ${{ secrets.BRAIN_API_KEY }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          # Screenshot storage
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          CLOUDINARY_FOLDER: ${{ secrets.CLOUDINARY_FOLDER }}
          # TIER 1: Chrome flags — full WebGL, no memory limits
          # Re-enabled: SharedArrayBuffer, BackForwardCache (were disabled for Render)
          # Kept: SwiftShader WebGL (GitHub runners don't have real GPUs)
          CHROMIUM_FLAGS: "--no-sandbox --disable-setuid-sandbox --disable-dev-shm-usage --disable-extensions --disable-background-networking --disable-default-apps --disable-sync --disable-translate --use-gl=angle --use-angle=swiftshader --enable-unsafe-swiftshader --window-size=1280,800"
          DISPLAY: ":99"
          NODE_ENV: production
          PORT: 10000
          HEADLESS: true
          LOG_LEVEL: info
          SAVE_SCREENSHOTS: false
          DB_PATH: /tmp/mathu-bot.db
          USER_DATA_DIR: /tmp/.browser-data
          LOG_DIR: /tmp/mathu-logs
          # TIER 1: FULL POWER mode — do NOT set RENDER, so memory-mode
          # won't force MINIMUM mode. All 35+ subsystems will start.
          # RENDER is intentionally NOT set here.
          # TIER 1: Enable Playwright trace recording
          ENABLE_TRACING: "true"
          TRACE_DIR: /tmp/mathu-logs/traces
          # TIER 1: Enable local OCR (Pix2Text)
          ENABLE_LOCAL_OCR: "true"
          # TIER 1+: Enable GAN telemetry (mouse movement GAN — was disabled on Render)
          ENABLE_GAN_TELEMETRY: "true"
          GAN_MODEL_PATH: "./models/mouse-gan.onnx"
          # TIER 1+: Enable local VLM (Phi-3.5-vision ONNX — runs locally, no API calls)
          # Falls back to cloud providers (Groq, z.ai, etc.) if local VLM fails.
          ENABLE_LOCAL_VLM: "true"
          LOCAL_VLM_MODEL: "onnx-community/Phi-3.5-vision-instruct-ONNX"
          # TIER 1+: Self-hosted LLM for self-heal (Ollama running locally)
          # The auditor reviews code patches using qwen2.5-coder:7b — no API calls
          AUDITOR_USE_ACTIVE: "false"
          AUDITOR_PROVIDER: "ollama"
          AUDITOR_MODEL: "qwen2.5-coder:7b"
          AUDITOR_API_KEY: "ollama"
          AUDITOR_ENDPOINT: "http://localhost:11434/v1/chat/completions"
          # Disable forced restarts (GitHub Actions handles timeout)
          MAX_UPTIME_HOURS: 0
          MAX_CYCLES_BEFORE_RESTART: 999999
        run: |
          chmod +x ./scripts/run-bot.sh
          ./scripts/run-bot.sh

      # ─── Step 9: Upload bot logs as artifact ───
      - name: Upload bot logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bot-logs-${{ github.run_id }}
          path: |
            /tmp/mathu-logs/
            !/tmp/mathu-logs/traces/*.zip
          retention-days: 7
          if-no-files-found: warn

      # ─── Step 10: Upload Playwright traces (separate artifact) ───
      # TIER 1: Playwright traces let you "replay" what the bot did.
      # Download the trace.zip, then run: npx playwright show-trace trace.zip
      - name: Upload Playwright traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces-${{ github.run_id }}
          path: /tmp/mathu-logs/traces/
          retention-days: 7
          if-no-files-found: warn

      # ─── Step 11: Trigger the next iteration ───
      - name: Trigger next iteration
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Triggering next MathU Bot Loop run..."
          gh workflow run mathu-bot-loop.yml \
            --repo ${{ github.repository }} \
            --ref main
          echo "Next run triggered successfully."
